<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaksa Wallet - Reaksa Ads Edition</title>
    
    <link rel="icon" type="image/png" href="https://i.postimg.cc/x8XThxPh/Chat-GPT-Image-Dec-6-2025-05-09-49-PM.png">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600&display=swap');
        :root { --primary: #4361ee; --income: #2ecc71; --expense: #ef476f; --balance: #4cc9f0; --dark: #2b2d42; }
        
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f0f4f8; margin: 0; padding: 15px; color: var(--dark); overflow-x: hidden; }

        /* --- Animations --- */
        @keyframes slideInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(67, 97, 238, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(67, 97, 238, 0); } 100% { box-shadow: 0 0 0 0 rgba(67, 97, 238, 0); } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }

        /* --- Auth Overlay --- */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.5s; }
        .auth-box { background: #fff; padding: 40px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); width: 100%; max-width: 360px; text-align: center; animation: slideInUp 0.6s; }
        .auth-logo { height: 80px; margin-bottom: 20px; animation: float 3s ease-in-out infinite; border-radius: 15px; }

        .container { max-width: 1100px; margin: auto; display: none; animation: slideInUp 0.7s ease-out; }
        
        /* --- Header --- */
        .header-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 25px; background: #fff; padding: 15px 25px; 
            border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.03); 
            transition: 0.3s;
        }
        .logo-img { height: 55px; width: 55px; border-radius: 12px; }
        .welcome-text { display: flex; flex-direction: column; }
        .welcome-msg { font-size: 12px; color: #6c757d; margin-top: 2px; }

        /* --- Cards --- */
        .card { background: #fff; padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); margin-bottom: 20px; transition: 0.3s; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { text-align: center; border-bottom: 6px solid transparent; }

        .progress-bar-bg { background: #eef2f5; border-radius: 15px; height: 12px; margin: 15px 0; overflow: hidden; }
        .progress-bar-fill { background: linear-gradient(90deg, var(--primary), var(--income)); height: 100%; width: 0%; transition: 1.2s cubic-bezier(0.22, 1, 0.36, 1); }

        input, select, .btn { width: 100%; padding: 13px; margin: 10px 0; border-radius: 15px; border: 2.5px solid #f0f3f7; box-sizing: border-box; font-family: inherit; }
        .btn { border: none; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: #fff; animation: pulse 2s infinite; }
        .btn-danger { background: #fee2e2; color: var(--expense); width: auto; padding: 8px 18px; border-radius: 12px; }

        .main-layout { display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }

        /* --- Footer --- */
        .footer { text-align: center; padding: 30px 10px; margin-top: 20px; border-top: 1px solid #e0e6ed; }
        .contact-link { color: var(--primary); text-decoration: none; font-weight: 600; margin: 0 10px; font-size: 14px; }
        .donate-btn { display: inline-block; background: #0066ff; color: white; padding: 10px 25px; border-radius: 30px; text-decoration: none; font-weight: bold; margin-top: 15px; transition: 0.3s; }
        .donate-btn:hover { background: #0052cc; transform: scale(1.05); }

        table { width: 100%; border-collapse: collapse; }
        td { padding: 15px 10px; border-bottom: 1px solid #f0f3f7; font-size: 14px; }
        .action-btn { border: none; background: none; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-box">
        <img src="https://i.postimg.cc/x8XThxPh/Chat-GPT-Image-Dec-6-2025-05-09-49-PM.png" class="auth-logo">
        <h2 id="auth-title">ចូលប្រើប្រាស់</h2>
        <div id="reg-fields" style="display: none;">
            <div style="display:flex; gap:10px;">
                <input type="text" id="ln" placeholder="នាមត្រកូល">
                <input type="text" id="fn" placeholder="នាមខ្លួន">
            </div>
        </div>
        <input type="email" id="auth-email" placeholder="អ៊ីមែល">
        <input type="password" id="auth-pass" placeholder="លេខសម្ងាត់">
        <button class="btn btn-primary" onclick="handleAuth()">បញ្ជាក់</button>
        <p id="auth-toggle" style="cursor:pointer; color: var(--primary); font-size: 13px; margin-top: 15px;" onclick="toggleAuthMode()">ចុះឈ្មោះគណនីថ្មី</p>
    </div>
</div>

<div class="container" id="app-container">
    <div class="header-bar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="https://i.postimg.cc/x8XThxPh/Chat-GPT-Image-Dec-6-2025-05-09-49-PM.png" class="logo-img">
            <div class="welcome-text">
                <h3 style="margin:0; color: var(--dark);">សួស្តីបង, <span id="user-display" style="color:var(--primary);">---</span>!</h3>
                <span class="welcome-msg">ប្រព័ន្ធគ្រប់គ្រងចំណូលចំណាយរបស់ Reaksa Ads</span>
            </div>
        </div>
        <button class="btn btn-danger" onclick="logout()">ចាកចេញ</button>
    </div>

    <div class="stats-grid">
        <div class="card stat-card" style="border-color: var(--income);"><span>ចំណូល</span><h2 id="disp-inc" style="color: var(--income); margin:10px 0 0 0;">$0</h2></div>
        <div class="card stat-card" style="border-color: var(--expense);"><span>ចំណាយ</span><h2 id="disp-exp" style="color: var(--expense); margin:10px 0 0 0;">$0</h2></div>
        <div class="card stat-card" style="border-color: var(--primary);"><span>សមតុល្យ</span><h2 id="disp-bal" style="color: var(--primary); margin:10px 0 0 0;">$0</h2></div>
    </div>

    <div class="main-layout">
        <div class="card">
            <h3 id="form-title" style="margin-top:0;">📝 កត់ត្រាថ្មី</h3>
            <input type="hidden" id="edit-key" value="">
            <input type="date" id="entry-date">
            <input type="text" id="desc" placeholder="បរិយាយ...">
            <input type="number" id="amount" placeholder="ទឹកប្រាក់ ($)">
            <select id="category">
                <option value="ចំណូល">💰 ចំណូល</option>
                <option value="ម្ហូបអាហារ">🍲 ម្ហូបអាហារ</option>
                <option value="សាំង/ធ្វើដំណើរ">🚗 សាំង/ធ្វើដំណើរ</option>
                <option value="ជួលផ្ទះ/ទឹកភ្លើង">🏠 ជួលផ្ទះ/ទឹកភ្លើង</option>
                <option value="ផ្សេងៗ">🎮 ផ្សេងៗ</option>
            </select>
            <button class="btn btn-primary" id="btn-save" onclick="saveData()">រក្សាទុកទិន្នន័យ</button>
        </div>

        <div class="card">
            <h3 style="margin:0 0 15px 0;">⏳ ប្រវត្តិប្រតិបត្តិការ</h3>
            <div style="overflow-x: auto;">
                <table><tbody id="data-list"></tbody></table>
            </div>
        </div>
    </div>

    <div class="footer">
        <div style="margin-bottom: 10px;">
            <a href="https://t.me/ReaksaAds" target="_blank" class="contact-link">✈️ Telegram</a>
            <span class="contact-link">📞 015 812 050 / 068 566 402</span>
        </div>
        <p style="font-size: 12px; color: #888;">© 2026 Reaksa Ads. All rights reserved.</p>
        <a href="https://link.payway.com.kh/ABAPAYRR442588h" target="_blank" class="donate-btn">☕ Donate / ឧបត្ថម្ភកាហ្វេ</a>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDJ-elcBfE3XjBscWxzljm4Tp0Zd2efIUM",
        authDomain: "system-1c7b5.firebaseapp.com",
        projectId: "system-1c7b5",
        storageBucket: "system-1c7b5.firebasestorage.app",
        messagingSenderId: "704156397881",
        appId: "1:704156397881:web:752ba6b379fe9b21c3f8e8",
        databaseURL: "https://system-1c7b5-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();
    
    let currentUser = null, dbData = {};
    document.getElementById('entry-date').valueAsDate = new Date();

    function toggleAuthMode() {
        const isReg = document.getElementById('reg-fields').style.display === 'none';
        document.getElementById('auth-title').innerText = isReg ? "ចុះឈ្មោះ" : "ចូលប្រើប្រាស់";
        document.getElementById('reg-fields').style.display = isReg ? "block" : "none";
    }

    function handleAuth() {
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-pass').value;
        const isReg = document.getElementById('reg-fields').style.display === 'block';

        if(isReg) {
            const fn = document.getElementById('fn').value;
            const ln = document.getElementById('ln').value;
            auth.createUserWithEmailAndPassword(email, pass).then(u => {
                database.ref('users/' + u.user.uid + '/profile').set({ firstName: fn, lastName: ln });
            }).catch(e => alert(e.message));
        } else {
            auth.signInWithEmailAndPassword(email, pass).catch(e => alert("ខុសអ៊ីមែល ឬលេខសម្ងាត់"));
        }
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            database.ref('users/' + user.uid).on('value', snapshot => {
                const val = snapshot.val() || {};
                const prof = val.profile || {};
                document.getElementById('user-display').innerText = (prof.lastName || "") + " " + (prof.firstName || "");
                dbData = val.records || {};
                updateDashboard();
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
            });
        } else {
            document.getElementById('auth-overlay').style.display = 'flex';
            document.getElementById('app-container').style.display = 'none';
        }
    });

    function updateDashboard() {
        const list = document.getElementById('data-list'); list.innerHTML = '';
        let inc = 0, exp = 0;
        Object.keys(dbData).reverse().forEach(key => {
            const item = dbData[key];
            const isInc = item.cat === 'ចំណូល';
            isInc ? inc += item.amt : exp += item.amt;
            list.innerHTML += `<tr>
                <td><small>${item.date}</small></td>
                <td><strong>${item.desc}</strong></td>
                <td style="color:${isInc?'var(--income)':'var(--expense)'}; font-weight:600;">$${item.amt}</td>
                <td style="text-align:right;">
                    <button class="action-btn" onclick="editItem('${key}')">📝</button>
                    <button class="action-btn" onclick="deleteItem('${key}')">🗑️</button>
                </td>
            </tr>`;
        });
        document.getElementById('disp-inc').innerText = `$${inc.toLocaleString()}`;
        document.getElementById('disp-exp').innerText = `$${exp.toLocaleString()}`;
        document.getElementById('disp-bal').innerText = `$${(inc - exp).toLocaleString()}`;
    }

    function saveData() {
        const date = document.getElementById('entry-date').value;
        const desc = document.getElementById('desc').value;
        const amt = parseFloat(document.getElementById('amount').value);
        const cat = document.getElementById('category').value;
        const key = document.getElementById('edit-key').value;
        if (!desc || isNaN(amt)) return alert("សូមបំពេញព័ត៌មាន!");
        const ref = database.ref('users/' + currentUser.uid + '/records');
        if (!key) ref.push({ date, desc, amt, cat });
        else ref.child(key).update({ date, desc, amt, cat });
        document.getElementById('desc').value = ""; document.getElementById('amount').value = "";
        document.getElementById('edit-key').value = "";
    }

    function editItem(key) {
        const item = dbData[key];
        document.getElementById('entry-date').value = item.date;
        document.getElementById('desc').value = item.desc;
        document.getElementById('amount').value = item.amt;
        document.getElementById('category').value = item.cat;
        document.getElementById('edit-key').value = key;
        document.getElementById('btn-save').innerText = "ធ្វើបច្ចុប្បន្នភាព";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteItem(key) { if(confirm("លុបទិន្នន័យ?")) database.ref('users/' + currentUser.uid + '/records/' + key).remove(); }
    function logout() { auth.signOut(); }
</script>
</body>
</html>
